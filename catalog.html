<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Catalog - The Weeping Fae</title>

    <link
        rel="stylesheet"
        href="styles.css"
    >
</head>

<body>

    <div id="site-header"></div>


    <section class="page-hero">

        <h1>
            Shop the Collection
        </h1>

        <p>
            Browse handcrafted Renaissance-inspired adornments.
        </p>

    </section>


    <section class="shop-tools">

        <div class="search-box">

            <input
                type="search"
                id="product-search"
                placeholder="Search chainmail, bells, earrings, hair pins..."
                aria-label="Search the jewelry collection"
            >

            <button onclick="searchProducts()">
                Search
            </button>

        </div>


        <div class="category-buttons">

            <button onclick="filterCategory('All')">
                All
            </button>

            <button onclick="filterCategory('Glasses Chains')">
                Glasses Chains
            </button>

            <button onclick="filterCategory('Bells')">
                Bells
            </button>

            <button onclick="filterCategory('Earrings')">
                Earrings
            </button>

            <button onclick="filterCategory('Hair Pins')">
                Hair Pins
            </button>

            <button onclick="filterCategory('Chainmail Necklaces')">
                Chainmail
            </button>

        </div>

    </section>


    <main>

        <section
            class="products"
            id="product-list"
        ></section>

    </main>


    <div
        class="product-modal-overlay"
        id="product-modal-overlay"
        onclick="closeProductModal()"
    ></div>


    <div
        class="product-modal"
        id="product-modal"
    >

        <button
            class="product-modal-close"
            onclick="closeProductModal()"
            aria-label="Close product details"
        >
            ×
        </button>


        <div class="product-modal-content">

            <div class="product-modal-image-container">

                <img
                    id="modal-product-image"
                    src=""
                    alt=""
                >

            </div>


            <div class="product-modal-info">

                <p
                    class="product-category"
                    id="modal-product-category"
                ></p>

                <h2 id="modal-product-name"></h2>

                <p
                    class="modal-price"
                    id="modal-product-price"
                ></p>

                <p
                    class="modal-description"
                    id="modal-product-description"
                ></p>


                <div class="product-detail-row">

                    <strong>
                        Materials
                    </strong>

                    <span id="modal-product-materials"></span>

                </div>


                <div class="product-detail-row">

                    <strong>
                        Dimensions
                    </strong>

                    <span id="modal-product-dimensions"></span>

                </div>


                <div class="product-detail-row">

                    <strong>
                        SKU
                    </strong>

                    <span id="modal-product-sku"></span>

                </div>


                <div class="product-detail-row">

                    <strong>
                        Availability
                    </strong>

                    <span id="modal-product-availability"></span>

                </div>


                <div class="quantity-section">

                    <p>
                        Quantity
                    </p>

                    <div class="quantity-control">

                        <button
                            onclick="decreaseQuantity()"
                            aria-label="Decrease quantity"
                        >
                            −
                        </button>

                        <span id="product-quantity">
                            1
                        </span>

                        <button
                            onclick="increaseQuantity()"
                            aria-label="Increase quantity"
                        >
                            +
                        </button>

                    </div>

                </div>


                <button
                    id="modal-add-cart"
                    class="modal-add-cart"
                    onclick="addModalProductToCart()"
                >
                    Add to Cart
                </button>

            </div>

        </div>

    </div>


    <div
        class="cart-overlay"
        id="cart-overlay"
        onclick="closeCart()"
    ></div>


    <div
        class="cart-window"
        id="cart-window"
    >

        <div class="cart-header">

            <h2>
                Your Shopping Cart
            </h2>

            <button
                class="close-cart"
                onclick="closeCart()"
                aria-label="Close cart"
            >
                ×
            </button>

        </div>


        <div id="cart-items"></div>


        <div class="cart-total">

            <strong>
                Subtotal:
                $<span id="cart-total">0.00</span>
            </strong>

        </div>


        <a
            href="catalog.html"
            class="continue-shopping"
        >
            Continue Shopping
        </a>

        <button
            class="future-checkout"
            disabled
        >
            Future Checkout
        </button>

    </div>


    <footer>

        <p>
            &copy; 2026 The Weeping Fae.
            All rights reserved.
        </p>

    </footer>


    <script src="header.js"></script>
    <script src="products.js"></script>
    <script src="cart.js"></script>
    <script src="store.js"></script>

    <script>
        displayCatalog();
        updateCart();
    </script>

</body>

</html>
